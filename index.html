<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi Pengeluaran & Anggaran</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Mengambil Chart.js untuk grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>Visualisasi Pengeluaran & Anggaran</h2>
            <div class="balance-card">
                <p>TOTAL SALDO</p>
                <h1 id="total-balance">Rp0</h1>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h3>Tambah Transaksi</h3>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="item-name">Nama Item</label>
                        <input type="text" id="item-name" placeholder="misal: Nasi Goreng" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Jumlah (Rp)</label>
                        <input type="number" id="amount" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category" required>
                            <option value="Makanan">Makanan</option>
                            <option value="Transportasi">Transportasi</option>
                            <option value="Hiburan">Hiburan</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Tambah Transaksi</button>
                </form>
            </section>

            <div class="dashboard-grid">
                <section class="list-section">
                    <h3>Daftar Transaksi</h3>
                    <ul id="transaction-list" class="list">
                        <!-- Transaksi akan diinjeksi via JavaScript -->
                    </ul>
                </section>

                <section class="chart-section">
                    <h3>Pengeluaran per Kategori</h3>
                    <canvas id="expense-chart"></canvas>
                </section>
            </div>
        </main>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
