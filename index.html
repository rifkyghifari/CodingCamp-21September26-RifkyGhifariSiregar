<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi Pengeluaran & Anggaran</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h2>Visualisasi Pengeluaran</h2>
                <!-- Tombol Dark Mode -->
                <button id="theme-toggle" class="btn-small">🌙 Mode Gelap</button>
            </div>
            <div class="balance-card">
                <p>TOTAL SALDO</p>
                <h1 id="total-balance">Rp0</h1>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h3>Tambah Transaksi</h3>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="item-name">Nama Item</label>
                        <input type="text" id="item-name" placeholder="misal: Nasi Goreng" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Jumlah (Rp)</label>
                        <input type="number" id="amount" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Kategori Utama</label>
                        <select id="category">
                            <option value="Makanan">Makanan</option>
                            <option value="Transportasi">Transportasi</option>
                            <option value="Hiburan">Hiburan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="custom-category">Atau Kategori Kustom (Opsional)</label>
                        <input type="text" id="custom-category" placeholder="misal: Tagihan Listrik">
                    </div>
                    <button type="submit" class="btn">Tambah Transaksi</button>
                </form>
            </section>

            <div class="dashboard-grid">
                <section class="list-section">
                    <div class="list-header">
                        <h3>Daftar Transaksi</h3>
                        <!-- Fitur Sort (Wajib ada agar JS tidak error) -->
                        <select id="sort-list">
                            <option value="default">Terbaru</option>
                            <option value="highest">Nominal Tertinggi</option>
                            <option value="lowest">Nominal Terendah</option>
                        </select>
                    </div>
                    <ul id="transaction-list" class="list"></ul>
                </section>

                <section class="chart-section">
                    <h3>Pengeluaran per Kategori</h3>
                    <canvas id="expense-chart"></canvas>
                </section>
            </div>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
